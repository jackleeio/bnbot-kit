<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BNBot</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #fbfbfd;
        --surface: #ffffff;
        --hairline: rgba(60, 60, 67, 0.12);
        --text: #1d1d1f;
        --text-secondary: rgba(60, 60, 67, 0.6);
        --text-tertiary: rgba(60, 60, 67, 0.4);
        --green: #30d158;
        --green-glow: rgba(48, 209, 88, 0.32);
        --gray: #c7c7cc;
        --accent: #ffffff;
        --accent-bg: #1d1d1f;
        --accent-bg-hover: #2c2c2e;
        --button-bg: rgba(120, 120, 128, 0.08);
        --button-bg-hover: rgba(120, 120, 128, 0.14);
        --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.04), 0 4px 12px -4px rgba(0, 0, 0, 0.06);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --bg: #1c1c1e;
          --surface: #2c2c2e;
          --hairline: rgba(255, 255, 255, 0.08);
          --text: #f5f5f7;
          --text-secondary: rgba(235, 235, 245, 0.6);
          --text-tertiary: rgba(235, 235, 245, 0.4);
          --gray: #48484a;
          --accent: #1d1d1f;
          --accent-bg: #f5f5f7;
          --accent-bg-hover: #e8e8ed;
          --button-bg: rgba(120, 120, 128, 0.24);
          --button-bg-hover: rgba(120, 120, 128, 0.36);
          --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 20px -6px rgba(0, 0, 0, 0.5);
        }
      }

      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display",
          "PingFang SC", "Helvetica Neue", system-ui, sans-serif;
        color: var(--text);
        background: var(--bg);
        width: 264px;
        font-size: 13px;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }

      #root { padding: 16px; }

      .popup-shell {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      /* — Header (no card, just a row) — */
      .popup-header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 2px 2px;
      }

      .brand-icon {
        width: 33px;
        height: 33px;
        border-radius: 8px;
        flex-shrink: 0;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08), 0 4px 10px -4px rgba(0, 0, 0, 0.1);
      }

      .brand-copy {
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 1px;
        flex: 1;
      }

      .brand-title {
        font-size: 15px;
        line-height: 1.15;
        font-weight: 600;
        letter-spacing: -0.015em;
        color: var(--text);
      }

      .brand-version {
        font-size: 11px;
        line-height: 1.2;
        color: var(--text-tertiary);
        font-weight: 500;
        font-variant-numeric: tabular-nums;
      }

      .download-button {
        appearance: none;
        border: none;
        background: var(--accent-bg);
        color: var(--accent);
        font-family: inherit;
        font-size: 12px;
        line-height: 1;
        padding: 7px 12px;
        border-radius: 999px;
        cursor: pointer;
        font-weight: 600;
        letter-spacing: -0.005em;
        white-space: nowrap;
        transition: background 150ms ease, transform 100ms ease;
      }
      .download-button:hover {
        background: var(--accent-bg-hover);
      }
      .download-button:active {
        transform: scale(0.97);
      }

      /* — Status card — */
      .status-card {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 11px 13px;
        min-height: 42px;
        background: var(--surface);
        border: 0.5px solid var(--hairline);
        border-radius: 12px;
        box-shadow: var(--shadow-card);
      }

      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        flex-shrink: 0;
        background: var(--gray);
      }
      .status-dot[data-state="connected"] {
        background: var(--green);
        animation: bnbot-pulse 2.4s ease-in-out infinite;
      }
      .status-dot[data-state="connecting"] {
        background: var(--gray);
        animation: bnbot-breathe 1.6s ease-in-out infinite;
      }

      .status-text {
        flex: 1;
        min-width: 0;
        font-size: 13px;
        line-height: 1.3;
        font-weight: 500;
        letter-spacing: -0.008em;
        color: var(--text);
      }

      .reconnect-button {
        appearance: none;
        border: none;
        background: var(--button-bg);
        color: var(--text);
        font-family: inherit;
        font-size: 11.5px;
        padding: 5px 10px;
        border-radius: 999px;
        cursor: pointer;
        font-weight: 500;
        white-space: nowrap;
        transition: background 150ms ease, transform 100ms ease;
      }
      .reconnect-button:hover { background: var(--button-bg-hover); }
      .reconnect-button:active { transform: scale(0.97); }

      @keyframes bnbot-breathe {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 1; }
      }
      @keyframes bnbot-pulse {
        0%, 100% { box-shadow: 0 0 0 0 var(--green-glow), 0 0 6px var(--green-glow); }
        50%      { box-shadow: 0 0 0 4px transparent,        0 0 12px var(--green-glow); }
      }

      /* Staggered entrance */
      .popup-header,
      .status-card {
        animation: bnbot-rise 480ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .popup-header { animation-delay: 0ms; }
      .status-card  { animation-delay: 70ms; }

      @keyframes bnbot-rise {
        from { opacity: 0; transform: translateY(6px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      @media (prefers-reduced-motion: reduce) {
        .status-dot, .popup-header, .status-card { animation: none !important; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./popup.tsx"></script>
  </body>
</html>
